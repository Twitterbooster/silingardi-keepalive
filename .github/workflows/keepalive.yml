name: Keep-alive silingardi.com

# Ping ogni 10 minuti (UTC) per tenere sveglio il sito su Render free tier.
# Cron: minuti 2-59 con passo 10 -> :02, :12, :22, :32, :42, :52 (evita l'inizio dell'ora).

on:
  schedule:
    - cron: "2-59/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: Ping https://www.silingardi.com/
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send HTTP request
        run: |
          code=$(curl -sS -L -o /dev/null -w "%{http_code}" --max-time 30 https://www.silingardi.com/)
          echo "HTTP $code"
          test "$code" = "200"